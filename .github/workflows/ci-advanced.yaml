name: ci-advanced

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run tests
        run: echo "running tests for event ${{ github.event_name }}"

  build:
    runs-on: ubuntu-latest
    needs: test
    # תנאי הרצה: הג'וב ירוץ רק אם האירוע הוא push לברנץ' main (ולא ב-pull_request)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Build app
        run: echo "building app for main branch push"
