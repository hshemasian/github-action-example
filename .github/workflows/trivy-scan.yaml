name: trivy-scan

on:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Print Trivy version
        run: trivy --version

      - name: Scan repository for vulnerabilities
        run: trivy fs . --severity HIGH,CRITICAL --exit-code 1

      - name: The sed command
        run: |
          sed -i "s|image: .*|image: hillel456/my-first-devsecops-app:${{ github.sha }}|g" k8s/deployment.yaml
          

      - name: Git commands
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
           git add k8s/deployment.yaml
          git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]"
          git push