name: Secrets and Variables Lab

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Part 1 - Print Environment Variable (Production)
        run: |
          echo "The environment variable MY_ENVIORMENT is: ${{ vars.MY_ENVIORMENT }}"

      - name: Part 2 - Print Repository Secret
        run: |
          echo "The secret JB_DEMO_USER is: ${{ secrets.JB_DEMO_USER }}"
