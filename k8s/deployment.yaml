apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-app
  labels:
    app: devsecops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsecops-app
  template:
    metadata:
      labels:
        app: devsecops-app
    spec:
      containers:
      - name: web-app
        image: hillel456/my-first-devsecops-app:2f141afb9d0aee25e25bd3cacbfaa80a6dbf4f22
        ports:
        - containerPort: 80
